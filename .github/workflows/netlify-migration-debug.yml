name: Netlify migration debug
on:
  push:
    branches:
      - railway-state-export-v2
jobs:
  netlify-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install project dependencies
        run: npm ci
      - name: Generate exact Netlify release
        run: |
          python3 - <<'PY'
          import tomllib, subprocess
          with open('netlify.toml','rb') as f:
              cfg=tomllib.load(f)
          subprocess.run(cfg['build']['command'], shell=True, check=True)
          PY
      - name: Bundle functions with Netlify ZISI
        run: |
          npm install --no-save @netlify/zip-it-and-ship-it@latest
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import { zipFunctions } from '@netlify/zip-it-and-ship-it';
          fs.mkdirSync('.netlify/functions-bundled',{recursive:true});
          const out=await zipFunctions('release/netlify/functions','.netlify/functions-bundled',{
            basePath:process.cwd(),
            config:{
              app:{nodeBundler:'esbuild'},
              'migration-export':{nodeBundler:'esbuild'}
            }
          });
          console.log(JSON.stringify(out,null,2));
          JS
