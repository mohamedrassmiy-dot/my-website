name: Live QA Runtime v7.5
on:
  push:
    branches: [live-qa-v74]
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Verify deploy preview 25
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://deploy-preview-25--rassmiy-marketing.netlify.app"
          for path in / /admin /robots.txt /sitemap.xml /api/health /api/content-cards /ar/services.html /en/services.html; do
            code=$(curl -L -sS -o /tmp/body -w "%{http_code}" "$BASE$path")
            echo "$path -> $code"
            test "$code" = "200"
            ! grep -q "This function has crashed" /tmp/body
            ! grep -q "ERR_REQUIRE_ESM" /tmp/body
            ! grep -q "MODULE_NOT_FOUND" /tmp/body
          done
          curl -LsS "$BASE/" -o /tmp/home
          curl -LsS "$BASE/admin" -o /tmp/admin
          curl -LsS "$BASE/assets/site.js" -o /tmp/sitejs
          curl -LsS "$BASE/robots.txt" -o /tmp/robots
          curl -LsS "$BASE/sitemap.xml" -o /tmp/sitemap
          curl -LsS "$BASE/api/health" -o /tmp/health
          ! grep -q "دخول العميل" /tmp/home
          ! grep -qi "Client Login" /tmp/home
          ! grep -q "دخول العميل" /tmp/sitejs
          grep -Eq 'name="csrf"|type="password"' /tmp/admin
          grep -q "Sitemap:" /tmp/robots
          grep -q "<urlset" /tmp/sitemap
          grep -q '"installed"' /tmp/health
          echo "LIVE_RUNTIME_QA_V75=PASS"
