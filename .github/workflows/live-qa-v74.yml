name: Diagnose Live Function v7.4
on:
  push:
    branches: [live-qa-v74]
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect preview function responses
        shell: bash
        run: |
          set -u
          BASE="https://deploy-preview-24--rassmiy-marketing.netlify.app"
          fail=0
          for path in /admin /api/health /robots.txt /sitemap.xml /api/content-cards; do
            echo "===== $path ====="
            code=$(curl -L -sS -D /tmp/headers -o /tmp/body -w "%{http_code}" "$BASE$path")
            echo "HTTP $code"
            cat /tmp/headers
            head -c 5000 /tmp/body || true
            echo
            [ "$code" = "200" ] || fail=1
          done
          exit "$fail"
