name: Live QA v5.4

on:
  push:
    branches:
      - qa-live-v53

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Verify preview v5.4
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://deploy-preview-9--rassmiy-marketing.netlify.app"
          for path in / /ar/services.html /en/services.html /ar/portfolio.html /en/portfolio.html /ar/contact.html /en/contact.html /robots.txt /sitemap.xml /admin /assets/site.js; do
            code=$(curl -L -s -o /tmp/page -w "%{http_code}" "$BASE$path")
            echo "$path -> $code"
            test "$code" = "200"
          done
          curl -Ls "$BASE/ar/services.html" | grep -Fq 'contact.html?service=seo-aeo'
          curl -Ls "$BASE/en/services.html" | grep -Fq 'contact.html?service=seo-aeo'
          curl -Ls "$BASE/ar/portfolio.html" | grep -Fq 'wa.me/966536741442'
          curl -Ls "$BASE/ar/contact.html" | grep -Fq 'mailto:mohamed.rassmiy@gmail.com'
          curl -Ls "$BASE/ar/contact.html" | grep -Fq 'linkedin.com/company/rassmiy-marketing/'
          curl -Ls "$BASE/ar/contact.html" | grep -Fq 'wa.me/966536741442'
          js=$(curl -Ls "$BASE/assets/site.js")
          printf '%s' "$js" | grep -Fq '__RASSMIY_CLICKS_V53__'
          printf '%s' "$js" | grep -Fq ".service-card,.case-card,[data-card-link]"
          echo "LIVE_QA_V54=PASS"
