name: Live QA v5.3

on:
  push:
    branches:
      - qa-live-v53

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Verify preview pages and click targets
        shell: bash
        run: |
          set -u
          BASE="https://deploy-preview-8--rassmiy-marketing.netlify.app"
          fail=0
          check_page() {
            local path="$1"
            code=$(curl -L -s -o /tmp/page -w "%{http_code}" "$BASE$path")
            echo "HTTP $path -> $code"
            [ "$code" = "200" ] || fail=1
          }
          check_contains() {
            local path="$1"; local needle="$2"; local label="$3"
            body=$(curl -Ls "$BASE$path")
            if printf '%s' "$body" | grep -Fq "$needle"; then
              echo "PASS $label"
            else
              echo "FAIL $label"
              echo "Needle: $needle"
              printf '%s' "$body" | grep -Eo 'href="[^"]+"|data-card-link="[^"]+"' | head -80 || true
              fail=1
            fi
          }
          for path in / /ar/services.html /en/services.html /ar/portfolio.html /en/portfolio.html /ar/contact.html /en/contact.html /robots.txt /sitemap.xml /admin; do check_page "$path"; done
          check_contains /ar/services.html 'contact.html?service=seo-aeo' 'AR service CTA'
          check_contains /en/services.html 'contact.html?service=seo-aeo' 'EN service CTA'
          check_contains /ar/portfolio.html 'contact.html?project=ecommerce-store' 'AR portfolio CTA'
          check_contains /ar/contact.html 'wa.me/966536741442' 'WhatsApp contact'
          check_contains /ar/contact.html 'linkedin.com/company/rassmiy-marketing/' 'Company LinkedIn'
          check_contains /assets/site.js '__RASSMIY_CLICKS_V53__' 'click JS'
          [ "$fail" = "0" ] && echo "LIVE_QA_V53=PASS" || { echo "LIVE_QA_V53=FAIL"; exit 1; }
