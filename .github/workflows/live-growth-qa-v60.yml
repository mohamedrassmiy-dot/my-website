name: Diagnose Growth v6.0 Runtime

on:
  push:
    branches:
      - qa-growth-v60

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose function routes
        shell: bash
        run: |
          BASE="https://deploy-preview-10--rassmiy-marketing.netlify.app"
          for path in /api/health /api/cards /en/articles /en/pages/seo-consultant-riyadh /en/articles/digital-marketing-strategy-saudi-arabia-2026; do
            echo "===== $path ====="
            curl -L -sS -D - "$BASE$path" -o /tmp/body || true
            head -c 1200 /tmp/body || true
            echo
          done
