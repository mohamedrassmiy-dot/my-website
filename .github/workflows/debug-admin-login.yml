name: Debug admin login
on:
  push:
    branches: [debug-login-v72]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and inspect state/session
        shell: bash
        run: |
          set -e
          cat cms-v45/app.* | base64 -d | gunzip > /tmp/app.mjs
          echo "=== first 180 lines ==="
          sed -n '1,180p' /tmp/app.mjs
          echo "=== persistence ==="
          grep -n -B 25 -A 80 -E "async function (loadState|saveState)|function (loadState|saveState)" /tmp/app.mjs || true
