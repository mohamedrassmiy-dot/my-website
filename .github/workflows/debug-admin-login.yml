name: Debug admin login
on:
  push:
    branches: [debug-login-v72]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and inspect admin auth
        shell: bash
        run: |
          set -e
          cat cms-v45/app.* | base64 -d | gunzip > /tmp/app.mjs
          echo "=== package ==="
          cat package.json
          echo "=== auth/session symbols ==="
          grep -nE "admin/login|Set-Cookie|session|cookie|handleLogin|loginForm|verifyPassword|password|SESSION|redirect\(" /tmp/app.mjs | head -220
          echo "=== login route context ==="
          grep -n -B 35 -A 90 "path==='/admin/login'" /tmp/app.mjs || true
          echo "=== admin route context ==="
          grep -n -B 30 -A 90 "path==='/admin'" /tmp/app.mjs || true
