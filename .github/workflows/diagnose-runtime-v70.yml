name: Diagnose Runtime Hotfix
on:
  push:
    branches: [hotfix-runtime-v70]
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
          cache: 'npm'
      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund
      - name: Dependency graph
        run: npm ls sanitize-html htmlparser2 @netlify/blobs
      - name: Run exact site build
        run: |
          rm -rf release && mkdir release
          unzip -q site.zip -d release
          rm -f release/netlify.toml release/_redirects
          mkdir -p release/netlify/functions release/assets
          cat cms-v45/app.* | base64 -d | gunzip > release/netlify/functions/app.mjs
          node cms-v45/seo-mobile-v46.mjs release/netlify/functions/app.mjs
          base64 -d cms-v45/admin-v45.js.b64 | gunzip > release/assets/admin.js
          base64 -d cms-v4/admin.css.b64 | gunzip > release/assets/admin.css
          cat cms-v4/admin-layout-fix.css >> release/assets/admin.css
          cat cms-v45/admin-bilingual.css >> release/assets/admin.css
          cat cms-v45/admin-mobile-v46.css >> release/assets/admin.css
          node cms-v45/public-site-fix.mjs release
          node cms-v45/qa-fixes.mjs release
          node cms-v45/ops-v51.mjs release
          node cms-v45/click-fixes-v53.mjs release
          node cms-v45/growth-cms-v60.mjs release
          node cms-v45/growth-content-v63.mjs release
          node cms-v45/security-v61.mjs release
          node cms-v45/db-encryption-v62.mjs release
          node cms-v45/hardening-v67.mjs release
          node cms-v45/positioning-v69.mjs release
          node cms-v45/visibility-v68.mjs release
          node cms-v45/runtime-hotfix-v70.mjs release
          node --check release/netlify/functions/app.mjs
          node --check release/assets/admin.js
          node --check release/assets/site.js
          node cms-v45/qa-suite-v51.mjs release
          node cms-v45/security-audit-v62.mjs release
          node cms-v45/growth-qa-v60.mjs release
          node cms-v45/runtime-qa-v70.mjs release
      - name: Inspect admin auth routes
        run: grep -n -C 6 "/admin/login" release/netlify/functions/app.mjs || true
      - name: CMS smoke and penetration regression
        run: node tests/cms-smoke.mjs
      - name: Static audit
        run: python3 tests/static-audit.py
