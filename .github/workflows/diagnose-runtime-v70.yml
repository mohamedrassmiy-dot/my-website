name: Diagnose Runtime Hotfix
on:
  push:
    branches: [hotfix-runtime-v70]
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
      - run: node -v
      - run: npm -v
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify dependency graph
        run: npm ls sanitize-html htmlparser2 @netlify/blobs
