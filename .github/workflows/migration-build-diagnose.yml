name: Migration Build Diagnose
on:
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
          cache: 'npm'
      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund
      - name: Run exact Netlify build command
        run: |
          python3 - <<'PY'
          import tomllib, subprocess
          with open('netlify.toml','rb') as f:
              cmd=tomllib.load(f)['build']['command']
          print(cmd)
          subprocess.run(cmd,shell=True,check=True)
          PY
      - name: Inspect persistence wiring
        run: |
          sed -n '65,105p' release/netlify/functions/app.mjs
          grep -n -E 'storeForContext|STATE|state-|getStore|getDeployStore|loadStateRaw|saveStateRaw' release/netlify/functions/app.mjs | head -80
      - name: Bundle functions like Netlify
        run: |
          npx --yes netlify-cli@latest functions:build --src release/netlify/functions --functions /tmp/netlify-functions-build --debug
