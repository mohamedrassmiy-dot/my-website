[build]
  command = "rm -rf release && mkdir release && unzip -q site.zip -d release && rm -f release/netlify.toml release/_redirects && mkdir -p release/netlify/functions release/assets && cat cms-v45/app.* | base64 -d | gunzip > release/netlify/functions/app.mjs && cp cms-v45/migration-export.mjs release/netlify/functions/migration-export.mjs && node --check release/netlify/functions/migration-export.mjs && node cms-v45/seo-mobile-v46.mjs release/netlify/functions/app.mjs && base64 -d cms-v45/admin-v45.js.b64 | gunzip > release/assets/admin.js && base64 -d cms-v4/admin.css.b64 | gunzip > release/assets/admin.css && cat cms-v4/admin-layout-fix.css >> release/assets/admin.css && cat cms-v45/admin-bilingual.css >> release/assets/admin.css && cat cms-v45/admin-mobile-v46.css >> release/assets/admin.css && node cms-v45/public-site-fix.mjs release && node cms-v45/qa-fixes.mjs release && node cms-v45/ops-v51.mjs release && node cms-v45/click-fixes-v53.mjs release && node cms-v45/growth-cms-v60.mjs release && node cms-v45/growth-content-v63.mjs release && node cms-v45/security-v61.mjs release && node cms-v45/db-encryption-v62.mjs release && node cms-v45/hardening-v67.mjs release && node cms-v45/positioning-v69.mjs release && node cms-v45/seo-demand-v78.mjs release && node cms-v45/visibility-v68.mjs release && node cms-v45/runtime-hotfix-v70.mjs release && node --check release/netlify/functions/app.mjs && node --check release/assets/admin.js && node --check release/assets/site.js && node cms-v45/qa-suite-v51.mjs release && node cms-v45/security-audit-v62.mjs release && node cms-v45/growth-qa-v60.mjs release && node cms-v45/runtime-qa-v70.mjs release && node cms-v45/seo-demand-qa-v78.mjs release && node tests/cms-smoke.mjs && python3 tests/static-audit.py"
  publish = "release"
  functions = "release/netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://www.google.com https://www.gstatic.com 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://www.google.com; frame-src 'self' https://www.google.com; form-action 'self'; base-uri 'self'; frame-ancestors 'self'; object-src 'none'; upgrade-insecure-requests"

# Rassmiy CMS v4.8 — stable build + bilingual CMS + responsive mobile
# Force production deploy

# mobile drawer v4.9 — iOS Safari fixed full-screen navigation

# root Arabic canonical homepage v5.0


[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

[[headers]]
  for = "/cache-flush.html"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
    Clear-Site-Data = "\"cache\""

