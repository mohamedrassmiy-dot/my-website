[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/"
  to = "/ar/"
  status = 302
  force = true

[[redirects]]
  from = "/admin"
  to = "https://gladio-egypt.vercel.app/admin/"
  status = 302
  force = true

[[redirects]]
  from = "/admin/*"
  to = "https://gladio-egypt.vercel.app/admin/:splat"
  status = 302
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, follow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
