[build]
  command = "rm -rf release && mkdir release && unzip -q site.zip -d release && rm -f release/netlify.toml release/_redirects && mkdir -p release/netlify/functions release/assets && cat cms-v45/app.* | base64 -d | gunzip > release/netlify/functions/app.mjs && node cms-v45/seo-mobile-v46.mjs release/netlify/functions/app.mjs && base64 -d cms-v45/admin-v45.js.b64 | gunzip > release/assets/admin.js && base64 -d cms-v4/admin.css.b64 | gunzip > release/assets/admin.css && cat cms-v4/admin-layout-fix.css >> release/assets/admin.css && cat cms-v45/admin-bilingual.css >> release/assets/admin.css && cat cms-v45/admin-mobile-v46.css >> release/assets/admin.css && node cms-v45/public-site-fix.mjs release && node cms-v45/qa-fixes.mjs release && node cms-v45/ops-v51.mjs release && node cms-v45/click-fixes-v53.mjs release && node cms-v45/growth-cms-v60.mjs release && node --check release/netlify/functions/app.mjs && node --check release/assets/admin.js && node --check release/assets/site.js && node cms-v45/qa-suite-v51.mjs release && node cms-v45/growth-qa-v60.mjs release"
  publish = "release"
  functions = "release/netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Rassmiy CMS v4.8 — stable build + bilingual CMS + responsive mobile
