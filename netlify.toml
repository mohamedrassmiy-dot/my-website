# root Arabic canonical homepage v5.0


[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

[[headers]]
  for = "/cache-flush.html"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
    Clear-Site-Data = "\"cache\""

